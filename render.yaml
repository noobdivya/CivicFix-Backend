# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# Values marked "sync: false" are asked for when the Blueprint is created.
services:
  - type: web
    name: civicfix-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # Neon connection string (direct, not pooled), with sslmode=require
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # your Vercel URL, e.g. https://civicfix.vercel.app
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD        # first admin account's password
        sync: false
      - key: AADHAAR_HASH_KEY      # never change this once reports exist
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_HOPS    # Vercel rewrite -> Render load balancer
        value: "2"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: NOMINATIM_USER_AGENT
        value: CivicFix/0.1 (https://github.com/noobdivya/CivicFix-Backend)

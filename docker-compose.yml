services:
  postgres:
    image: postgres:16-alpine
    container_name: civicfix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicfix
      POSTGRES_PASSWORD: civicfix
      POSTGRES_DB: civicfix
    ports:
      - "5432:5432"
    volumes:
      - civicfix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicfix -d civicfix"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  civicfix-pgdata:
